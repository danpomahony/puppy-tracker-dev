- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ufw
      - unattended-upgrades
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Harden the SSH server
  ansible.builtin.copy:
    src: 10-hardening.conf
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

- name: Turn on automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Rules go in before the firewall is switched on, so SSH is never cut off.
# Note that ports published by Docker bypass ufw. Services behind Caddy
# should bind to 127.0.0.1 (see #22).
- name: Allow SSH, with a rate limit
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp

- name: Deny other incoming traffic and allow outgoing
  community.general.ufw:
    default: "{{ item.default }}"
    direction: "{{ item.direction }}"
  loop:
    - { direction: incoming, default: deny }
    - { direction: outgoing, default: allow }

- name: Enable the firewall
  community.general.ufw:
    state: enabled
