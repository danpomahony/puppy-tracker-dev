# Docker Engine from Docker's own apt repository, as in their install guide.
# The architecture is looked up so the same role works on amd64 and arm64.
- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
  register: docker_repo

- name: Refresh the package list if the repository changed
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo is changed

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Start Docker at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# The deploy user runs docker without sudo, so CI can deploy over Tailscale SSH (ADR 0005).
- name: Let the deploy user run docker
  ansible.builtin.user:
    name: deploy
    groups: docker
    append: true

- name: Create the directory the deploy script works from
  ansible.builtin.file:
    path: /opt/puppy
    state: directory
    owner: deploy
    group: deploy
    mode: "0755"
