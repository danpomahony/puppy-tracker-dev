name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out which parts of the repo changed, so docs-only changes skip the heavy jobs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On pull requests the action lists changed files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      scripts: ${{ steps.filter.outputs.scripts }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3.0.4
        id: filter
        with:
          # The workflow file is in every list, so a workflow change always runs everything.
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/**'
            scripts:
              - 'scripts/**'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - 'scripts/**'
              - 'compose.yaml'
              - '.github/workflows/**'

  app:
    name: App (lint, test and build)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  scripts:
    name: Scripts (shellcheck)
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck scripts/*.sh

  backend:
    name: Backend (API smoke test)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Start PocketBase
        run: docker compose up -d --build backend

      - name: Wait until healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8090/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Backend did not become healthy" >&2
          exit 1

      - name: Create a throwaway superuser
        run: |
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          echo "PB_SUPERUSER_PASSWORD=$PW" >> "$GITHUB_ENV"
          docker compose exec -T backend /pb/pocketbase superuser upsert ci@example.test "$PW" \
            --dir=/pb_data --migrationsDir=/pb_migrations

      - name: Run the smoke test
        run: bash ./scripts/smoke-test.sh
        env:
          PB_SUPERUSER_EMAIL: ci@example.test

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs backend

  # Require this job if branch protection is added. It always runs, and passes when the
  # jobs above passed or were skipped. A skipped job on its own would block merging.
  ci-ok:
    name: CI passed
    needs: [changes, app, scripts, backend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A CI job failed or was cancelled" >&2
            exit 1
          fi
