name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Phone
        - Laptop browser
        - Backend or API
        - CI
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Screenshots, error messages or console output.
